name: Tool or feature request
description: Suggest a new tool or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve for your server?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
  - type: input
    id: plugins
    attributes:
      label: Plugins involved (if any)
