<!doctype html>
<html lang="en">
<head>

  <!-- This page can be served at any URL depth, so it is fully self-contained. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse 70% 45% at 50% -12%, rgba(70, 110, 230, 0.16), transparent 70%), #05080f;
      color: #e8eefb;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    svg { width: 56px; height: 56px; margin: 0 auto 24px; display: block; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; letter-spacing: 0.1em; color: #a78bfa; }
    h1 { margin: 10px 0 12px; font-size: 1.8rem; letter-spacing: -0.02em; }
    p { margin: 0 0 28px; color: #a3b0c8; line-height: 1.6; }
    a {
      display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px;
      border-radius: 8px; background: #8ccfff; color: #04101f; font-weight: 600; text-decoration: none;
    }
    a:hover { background: #b3e0ff; }
    a:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M16 3 27 9.5v13L16 29 5 22.5v-13Z" stroke="#8ccfff" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="3 3"/>
      <circle cx="16" cy="16" r="2.4" fill="#a78bfa"/>
    </svg>
    <div class="code">ERROR 404</div>
    <h1>This chunk didn't load.</h1>
    <p>The page you're looking for doesn't exist or was moved.</p>
    <a id="home-link" href="/">Back to MC Toolkit</a>
  </main>
  <script>
    // On a GitHub project site (user.github.io/repo/) the home page lives under /repo/.
    (function () {
      var link = document.getElementById('home-link');
      if (/\.github\.io$/.test(location.hostname)) {
        var first = location.pathname.split('/')[1];
        if (first) link.href = '/' + first + '/';
      }
    })();
  </script>
</body>
